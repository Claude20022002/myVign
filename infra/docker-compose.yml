# Services locaux de développement (partie B).
# Lancer : pnpm infra:up   ·   Arrêter : pnpm infra:down
# Le stockage S3 compatible (photos de sinistres) sera ajouté en phase 3.
name: myvign

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: myvign
      POSTGRES_PASSWORD: myvign_dev_only
      POSTGRES_DB: myvign
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myvign"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Boîte de réception de test : capture les e-mails envoyés en local (interface sur :8025).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  postgres-data:
  redis-data:
