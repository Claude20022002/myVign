<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" role="img" aria-labelledby="t">
  <title id="t">Architecture du monorepo myVign</title>
  <rect width="980" height="280" fill="#F5F7F9"/>
  <g font-family="Atkinson Hyperlegible Next, Segoe UI, system-ui, sans-serif">
    <rect x="20" y="40" width="200" height="120" rx="14" fill="#fff" stroke="#D5DDE5"/>
