    <text x="120" y="136" text-anchor="middle" font-size="13" fill="#6B7885">Parcours client</text>

    <path d="M220 100 H310" stroke="#1790CD" stroke-width="2" marker-end="url(#fleche)"/>
    <rect x="310" y="40" width="240" height="120" rx="14" fill="#E8F4FB" stroke="#1790CD"/>
    <text x="430" y="82" text-anchor="middle" font-family="Saira, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="#1B2733">@myvign/contracts</text>
