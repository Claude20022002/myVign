    <text x="430" y="130" text-anchor="middle" font-size="13" fill="#6B7885">Source de vérité API</text>

    <path d="M550 100 H640" stroke="#1790CD" stroke-width="2" marker-end="url(#fleche)"/>
    <rect x="640" y="24" width="200" height="70" rx="14" fill="#fff" stroke="#D5DDE5"/>
    <text x="740" y="54" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2733">API (à venir)</text>
