  <text x="20" y="198" font-family="Saira, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="600" fill="#1B2733">ce véhicule ?</text>
  <text x="20" y="230" font-family="Atkinson Hyperlegible Next, Segoe UI, system-ui, sans-serif" font-size="16" fill="#4E5D6C">Le prix dépend surtout de lusage.</text>

