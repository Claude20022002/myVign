<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 780" role="img" aria-labelledby="t">
  <title id="t">Écran urgence sinistre auto</title>
  <rect width="390" height="780" rx="28" fill="#F5F7F9"/>
  <rect width="390" height="3" fill="#1790CD"/>
  <rect y="3" width="390" height="64" fill="#fff"/>
  <line x1="0" y1="67" x2="390" y2="67" stroke="#D5DDE5"/>
  <text x="20" y="44" font-family="Saira, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="#1790CD">SONAS</text>
  <rect x="286" y="18" width="84" height="36" rx="10" fill="#fff" stroke="#D5DDE5"/>
  <text x="328" y="42" text-anchor="middle" font-family="Atkinson Hyperlegible Next, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" fill="#116A97">Aide</text>

  <rect x="20" y="88" width="78" height="4" rx="2" fill="#1790CD"/>
  <rect x="108" y="88" width="86" height="4" rx="2" fill="#D5DDE5"/>
  <rect x="210" y="88" width="80" height="4" rx="2" fill="#D5DDE5"/>
  <rect x="308" y="88" width="62" height="4" rx="2" fill="#D5DDE5"/>
  <text x="20" y="128" font-family="Atkinson Hyperlegible Next, Segoe UI, system-ui, sans-serif" font-size="15" fill="#4E5D6C">Déclarer un sinistre auto, 1 sur 3</text>
  <text x="20" y="172" font-family="Saira, Segoe UI, system-ui, sans-serif" font-size="28" font-weight="600" fill="#1B2733">Tout le monde</text>
  <text x="20" y="208" font-family="Saira, Segoe UI, system-ui, sans-serif" font-size="28" font-weight="600" fill="#1B2733">va bien ?</text>
  <text x="20" y="244" font-family="Atkinson Hyperlegible Next, Segoe UI, system-ui, sans-serif" font-size="16" fill="#4E5D6C">Si quelquun est blessé, appelez dabord les secours.</text>

  <rect x="20" y="272" width="350" height="128" rx="10" fill="#FEF0F2"/>
  <text x="40" y="308" font-family="Atkinson Hyperlegible Next, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#B0081C">Blessés ou danger immédiat</text>
  <rect x="40" y="324" width="310" height="52" rx="10" fill="#CA0920"/>
  <text x="195" y="358" text-anchor="middle" font-family="Atkinson Hyperlegible Next, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#fff">Appeler le 112</text>

  <rect x="20" y="424" width="350" height="72" rx="14" fill="#fff" stroke="#D5DDE5"/>
  <circle cx="48" cy="460" r="10" fill="none" stroke="#7A8794" stroke-width="1.5"/>
  <text x="72" y="454" font-family="Atkinson Hyperlegible Next, Segoe UI, system-ui, sans-serif" font-size="16" fill="#1B2733">Besoin dune dépanneuse</text>
  <text x="72" y="476" font-family="Atkinson Hyperlegible Next, Segoe UI, system-ui, sans-serif" font-size="14" fill="#4E5D6C">Assistance 24 h/24</text>

  <rect x="20" y="508" width="350" height="72" rx="14" fill="#E8F4FB" stroke="#116A97" stroke-width="2"/>
  <circle cx="48" cy="544" r="10" fill="none" stroke="#116A97" stroke-width="6"/>
  <text x="72" y="538" font-family="Atkinson Hyperlegible Next, Segoe UI, system-ui, sans-serif" font-size="16" fill="#1B2733">Personne nest blessé</text>
  <text x="72" y="560" font-family="Atkinson Hyperlegible Next, Segoe UI, system-ui, sans-serif" font-size="14" fill="#4E5D6C">Je continue ma déclaration</text>

  <rect y="640" width="390" height="140" fill="#fff"/>
  <line x1="0" y1="640" x2="390" y2="640" stroke="#D5DDE5"/>
  <text x="20" y="674" font-family="Atkinson Hyperlegible Next, Segoe UI, system-ui, sans-serif" font-size="14" fill="#1E6B45">Brouillon gardé 60 jours</text>
  <rect x="20" y="696" width="350" height="48" rx="10" fill="#F5C800"/>
  <text x="195" y="728" text-anchor="middle" font-family="Atkinson Hyperlegible Next, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1B2733">Continuer</text>
</svg>
