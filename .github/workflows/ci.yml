name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint et format (Biome, paquets)
        run: pnpm lint
      - name: Lint du site (ESLint)
        run: pnpm --filter @myvign/web lint
      - name: Typage
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Contrat OpenAPI à jour
        run: pnpm openapi
